name: Build ShiftCalendar APK

on:
  push:
    paths:
      - 'ShiftCalendar-Android-Project.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -q ShiftCalendar-Android-Project.zip
          test -f ShiftCalendar/app/build.gradle.kts

      - name: Build APK
        run: |
          cd ShiftCalendar
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiftCalendar-APK
          path: ShiftCalendar/app/build/outputs/apk/debug/app-debug.apk
