
name: Build ShiftCalendar APK

on:
  push:
    paths:
      - 'ShiftCalendar-Android-Project.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract project
        run: |
          unzip -oq ShiftCalendar-Android-Project.zip -d extracted

          APP_GRADLE="$(find extracted -type f -path '*/app/build.gradle.kts' -print -quit)"
          if [ -z "$APP_GRADLE" ]; then
            APP_GRADLE="$(find extracted -type f -path '*/app/build.gradle' -print -quit)"
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app Gradle file not found"
            find extracted -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Fix widget description
        run: |
          FILE="$(find "$PROJECT_DIR" -type f -name 'month_widget_info.xml' -print -quit)"
          if [ -n "$FILE" ]; then
            sed -i 's|android:description="[^"]*"|android:description="@string/widget_description"|' "$FILE"
            RES_DIR="$(dirname "$(dirname "$FILE")")"
            mkdir -p "$RES_DIR/values"
            printf '%s\n' '<resources><string name="widget_description">Месячный календарь смен</string></resources>' > "$RES_DIR/values/widget_strings.xml"
          fi

      - name: Fix JVM targets
        run: |
          python3 - "$PROJECT_DIR" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          files = list(root.rglob("build.gradle")) + list(root.rglob("build.gradle.kts"))

          for path in files:
              text = path.read_text(encoding="utf-8")
              original = text

              text = re.sub(
                  r'(?m)^(\s*sourceCompatibility\s*=\s*)JavaVersion\.VERSION_1_8\b',
                  r'\1JavaVersion.VERSION_17',
                  text
              )
              text = re.sub(
                  r'(?m)^(\s*targetCompatibility\s*=\s*)JavaVersion\.VERSION_1_8\b',
                  r'\1JavaVersion.VERSION_17',
                  text
              )
              text = re.sub(
                  r'(?m)^(\s*sourceCompatibility\s*=\s*)JavaVersion\.VERSION_1_8\b',
                  r'\1JavaVersion.VERSION_17',
                  text
              )

              if path.name == "build.gradle.kts":
                  text = re.sub(
                      r'(?m)^(\s*jvmTarget\s*=\s*)"1\.8"',
                      r'\1"17"',
                      text
                  )
              else:
                  text = re.sub(
                      r'(?m)^(\s*jvmTarget\s*=\s*)["\']1\.8["\']',
                      r'\1"17"',
                      text
                  )

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  print("Updated JVM settings in", path)
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiftCalendar-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
