
name: Build ShiftCalendar APK

on:
  push:
    paths:
      - 'ShiftCalendar-Android-Project.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract project
        run: |
          echo "ZIP archive contents:"
          unzip -l ShiftCalendar-Android-Project.zip | head -100
          unzip -oq ShiftCalendar-Android-Project.zip -d extracted

          echo "Searching for Gradle project..."
          find extracted -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \)

          APP_GRADLE="$(find extracted -type f -path '*/app/build.gradle.kts' -print -quit)"
          if [ -z "$APP_GRADLE" ]; then
            APP_GRADLE="$(find extracted -type f -path '*/app/build.gradle' -print -quit)"
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: Android app Gradle file not found."
            find extracted -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix widget description
        run: |
          FILE="$(find "$PROJECT_DIR" -type f -name 'month_widget_info.xml' -print -quit)"

          if [ -z "$FILE" ]; then
            echo "Widget XML not found. Searching XML files:"
            find "$PROJECT_DIR" -type f -name '*.xml' | head -100
            exit 1
          fi

          echo "Found widget file: $FILE"

          sed -i 's|android:description="[^"]*"|android:description="@string/widget_description"|' "$FILE"

          RES_DIR="$(dirname "$(dirname "$FILE")")"
          VALUES_DIR="$RES_DIR/values"
          mkdir -p "$VALUES_DIR"

          printf '%s\n' '<resources><string name="widget_description">Месячный календарь смен</string></resources>' > "$VALUES_DIR/widget_strings.xml"

          echo "Updated description:"
          grep 'android:description=' "$FILE"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiftCalendar-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
