
name: Build ShiftCalendar APK

on:
  push:
    paths:
      - 'ShiftCalendar-Android-Project.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      
      
      - name: Fix widget description
        run: |
          FILE="$(find . -type f -name 'month_widget_info.xml' -print -quit)"
          if [ -z "$FILE" ]; then
            echo "ERROR: month_widget_info.xml not found"
            find . -type f -name '*.xml' | head -50
            exit 1
          fi
          echo "Found file: $FILE"
          sed -i 's|android:description="[^"]*"|android:description="@string/widget_description"|' "$FILE"
          VALUES_DIR="$(dirname "$(dirname "$FILE")")/values"
          mkdir -p "$VALUES_DIR"
          printf '%s\n' '<resources><string name="widget_description">Месячный календарь смен</string></resources>' > "$VALUES_DIR/widget_strings.xml"
          grep 'android:description=' "$FILE"

      - name: Fix widget description
        run: |
          sed -i 's|android:description="@string/app_name"|android:description="@string/widget_description"|' ShiftCalendar/app/src/main/res/xml/month_widget_info.xml
          mkdir -p ShiftCalendar/app/src/main/res/values
          printf '%s\n' '<resources><string name="widget_description">Месячный календарь смен</string></resources>' > ShiftCalendar/app/src/main/res/values/widget_strings.xml


      - name: Build APK
        run: |
          cd ShiftCalendar
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiftCalendar-APK
          path: ShiftCalendar/app/build/outputs/apk/debug/app-debug.apk
