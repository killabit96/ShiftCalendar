
name: Build ShiftCalendar APK

on:
  push:
    paths:
      - 'ShiftCalendar-Android-Project.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract project
        run: |
          unzip -q ShiftCalendar-Android-Project.zip
          test -f ShiftCalendar/app/build.gradle.kts


      - name: Fix widget description
        run: |
          sed -i 's|android:description="@string/app_name"|android:description="@string/widget_description"|' ShiftCalendar/app/src/main/res/xml/month_widget_info.xml
          mkdir -p ShiftCalendar/app/src/main/res/values
          printf '%s\n' '<resources><string name="widget_description">Месячный календарь смен</string></resources>' > ShiftCalendar/app/src/main/res/values/widget_strings.xml


      - name: Build APK
        run: |
          cd ShiftCalendar
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiftCalendar-APK
          path: ShiftCalendar/app/build/outputs/apk/debug/app-debug.apk
